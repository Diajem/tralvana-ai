services:
  - type: web
    name: tralvana-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tralvana-production
          property: connectionString
      - key: TRAVELOS_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://app.tralvana.com,https://tralvana-web.onrender.com
      - key: TRALVANA_AUTH_MODE
        value: CLERK
      - key: CLERK_AUTHORIZED_PARTIES
        value: https://app.tralvana.com
      - key: CLERK_JWT_KEY
        sync: false
      - key: DUFFEL_API_TOKEN
        sync: false
      - key: TRALVANA_PROVIDER_ENVIRONMENT
        value: MOCK
      - key: TRALVANA_FLIGHT_PROVIDER_MODE
        sync: false
      - key: TRALVANA_FLIGHT_MOCK_FALLBACK_ENABLED
        value: "false"
      - key: TRALVANA_ACCOMMODATION_PROVIDER_MODE
        sync: false
      - key: TRALVANA_EVENT_PROVIDER_MODE
        sync: false

  - type: web
    name: tralvana-web
    runtime: docker
    plan: starter
    region: frankfurt
    domains:
      - app.tralvana.com
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://tralvana-api.onrender.com
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up

databases:
  - name: tralvana-production
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: tralvana
    user: tralvana
    ipAllowList: []
